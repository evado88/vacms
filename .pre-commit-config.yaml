# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
    python: python3

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-merge-conflict

- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: v0.11.12
  hooks:
    - id: ruff-check

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 25.1.0
  hooks:
    - id: black

- repo: https://github.com/adamchainz/django-upgrade
  rev: 1.22.1
  hooks:
    - id: django-upgrade
      args: [--target-version, "4.1"]

- repo: local
  hooks:
    - id: check-vasa-mapping
      name: check VASA generated mapping
      entry: python manage.py generate_vasa_mapping --check --quiet
      language: system
      pass_filenames: false
      files: ^(va_explorer/va_data_management/(vasa/|management/commands/generate_vasa_mapping.py|utils/xlsform.py)|va_explorer/static/data/.*\.xlsx)$
    - id: check-linkage-crosswalk
      name: check Death-VA linkage crosswalk
      entry: python manage.py generate_linkage_crosswalk --check --quiet
      language: system
      pass_filenames: false
      files: ^(va_explorer/va_data_management/(linkage/|management/commands/generate_linkage_crosswalk.py|utils/xlsform.py|vasa/field_map.py)|va_explorer/static/data/.*\.(xlsx|csv))$
