<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Active</th>
      <th>Role</th>
      <th>&nbsp;</th>
      <th>&nbsp;</th>
    </tr>
  </thead>
  <tbody>
    {% for user in object_list %}
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.is_active }}</td>
        <td>{{ user.groups.all.0.name }}</td>
        <td>
          {% if perms.users.change_user %}
            <a href="{% url 'users:update' pk=user.pk %}" class="btn btn-primary" role="button">Edit</a>
          {% endif %}
        </td>
        <td>
          {% if perms.users.view_user %}
            <a href="{% url 'users:detail' pk=user.pk %}" class="btn btn-primary" role="button">Show</a>
          {% endif %}
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
