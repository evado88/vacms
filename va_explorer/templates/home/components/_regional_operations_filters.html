<select class="form-control" aria-label="Geography filter" id="geographyFilterSelect{{ filter_suffix|default:'' }}">
  <option value="" disabled {% if selected_geography == "" %}selected{% endif %}>Region</option>
  {% for option in geography_options %}
    <option value="{{ option.value }}" {% if option.value == selected_geography %}selected{% endif %}>{{ option.label }}</option>
  {% endfor %}
</select>
<span class="filters-title">Time filters</span>
<div class="filters-radio-group" role="radiogroup" aria-label="Preset time filters">
  {% for preset in time_presets %}
    <div class="form-check">
      <input class="form-check-input" type="radio" name="timePreset{{ filter_suffix|default:'' }}" id="{{ preset.id }}{{ filter_suffix|default:'' }}" {% if preset.id == selected_time_preset %}checked{% endif %}>
      <label class="form-check-label" for="{{ preset.id }}{{ filter_suffix|default:'' }}">{{ preset.label }}</label>
    </div>
  {% endfor %}
</div>
<div class="filters-datetime-group">
  <input type="date" class="form-control" aria-label="Start date" id="timeStartDate{{ filter_suffix|default:'' }}" value="{{ selected_start_date }}">
  <input type="date" class="form-control" aria-label="End date" id="timeEndDate{{ filter_suffix|default:'' }}" value="{{ selected_end_date }}">
</div>
<button type="button" class="btn btn-outline-secondary filters-reset-btn" id="regionalFiltersReset{{ filter_suffix|default:'' }}">Reset</button>
